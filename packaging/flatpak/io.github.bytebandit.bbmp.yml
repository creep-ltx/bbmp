# SPDX-License-Identifier: GPL-3.0-or-later
# ByteBandit Music Player as a Flatpak. Written by manifest.py (edit that, not this);
# make.sh builds it. Every module is built inside the SDK from bbmp-sources, for any x86-64.
{
  "app-id": "io.github.bytebandit.bbmp",
  "runtime": "org.freedesktop.Platform",
  "runtime-version": "26.08",
  "sdk": "org.freedesktop.Sdk",
  "command": "bbmp",
  "finish-args": [
    "--share=network",
    "--socket=pulseaudio",
    "--filesystem=xdg-music",
    "--filesystem=xdg-download:ro",
    "--env=BBMP_OPT=/app/opt"
  ],
  "build-options": {
    "cflags": "-O2 -march=x86-64 -mtune=generic",
    "cflags-override": true,
    "cxxflags": "-O2 -march=x86-64 -mtune=generic",
    "cxxflags-override": true,
    "env": {
      "BBMP_OPT": "/app/opt",
      "BBMP_PUBLIC": "1",
      "JOBS": "4",
      "LIBRARY_PATH": "/app/lib"
    },
    "strip": true,
    "no-debuginfo": true
  },
  "cleanup": [
    "/include",
    "/lib/pkgconfig",
    "/lib/cmake",
    "/share/man",
    "/share/doc",
    "*.la",
    "*.a",
    "/opt/*/include",
    "/opt/*/lib/pkgconfig",
    "/opt/*/share/man",
    "/opt/*/share/doc"
  ],
  "modules": [
    {
      "name": "libresidfp",
      "buildsystem": "autotools",
      "config-opts": [
        "--disable-static"
      ],
      "sources": [
        {
          "type": "archive",
          "path": "sources/archives/libresidfp-1.2.2.tar.gz",
          "sha256": "2eb0204b76d52fe825c0e1f98826f62a179033a60543032d0e8b90060ecaa50e"
