# What is known about formats beyond what the census counts. tools/format_status.py
# makes docs/formats.md from this file and tools/format_census.json.
#
#   status   verified   the replayer's output, or what it writes to the sound chip,
#                       was compared with the original replay routine and is the same
#            compared   compared with another player of the format and found alike
#            unchecked  plays; there was nothing to compare it with
#            faults     plays, and something is known to be wrong or missing
#            off        a replayer exists and is switched off
#            (a format that needs a file from the user which isn't there is shown as
#            "needs a file from you" by the player, whatever is said here)
#            no         doesn't play
#   all      songs that play, of all the format's songs, where all were tried
#   basis    what the status rests on
#   note     what is wrong, missing or open
#   nosong   how many of the format's files hold no song (empty, or damaged in the
#            collection), in words; they are not counted against the format

