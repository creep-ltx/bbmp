# ---- checked against the original players, register by register (2 October 2026) ----

["Spectrum - Pro Tracker 3"]
status = "verified"
basis = "every write to the AY chip, frame by frame, against Vortex Tracker II's own Z80 player (S.V. Bulba) on an emulated Z80, for all 7,376 of Modland's songs: 7,218 of the 7,297 compared the same in every frame (tools/verify)"
note = "Of the rest: 88 have a channel that plays before it chooses a sample, which Pro Tracker 3 leaves undefined (played with sample 1, as Vortex Tracker's editor does); 16 start a sample or ornament past its end, where the original plays whatever bytes follow for a frame; 11 files are cut short on Modland; 52 differ, mostly in a few frames of a slide. Two faults of ZXTune were found and mended: a note and its ornament, and the channels' envelope offsets, are added in a byte, as in the original. Turbo Sound songs (two chips, 61) were not compared."

["Spectrum - Pro Tracker 2"]
status = "verified"
basis = "every write to the AY chip, frame by frame, against Pro Tracker 2.101's own Z80 player (GDC, from a magazine's listing of it) on an emulated Z80, for all 6,243 of Modland's songs: 5,966 the same in every frame (tools/verify)"
note = "Four faults of ZXTune were found and mended: the volume table is rounded, a pattern plays to its end however long, a 00 in a row is a noise command, and a note past the 96 notes' table plays what the original player's memory has there (the start of its volume table). Of the rest: 195 differ in a few frames where such a note is involved, 42 have a channel that plays before it chooses a sample (undefined in the original), 4 play as S.V. Bulba's player, which mends faults of the original, 1 file is cut short; 35 differ. The original plays a song's first row after its delay less a frame; the player plays it at once."


